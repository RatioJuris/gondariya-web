<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>
  {{ page.title | default: site.title }}
  {% unless page.title == site.title %}
   | {{ site.title }}
  {% endunless %}
</title>

<meta
  name="description"
  content="{{ page.description | default: site.description | escape }}"
>

{% if page.keywords %}
<meta
  name="keywords"
  content="{{ page.keywords | join: ', ' | escape }}"
>
{% endif %}

<meta
  name="robots"
  content="{{ page.robots | default: 'index,follow' }}"
>

<link
  rel="canonical"
  href="{{ page.canonical | default: page.url | absolute_url }}"
>

<link
  rel="icon"
  type="image/svg+xml"
  href="{{ '/assets/favicon.svg' | relative_url }}"
>

{% seo %}

{% if page.og %}
<meta property="og:title"
      content="{{ page.og.title | default: page.title | escape }}">

<meta property="og:description"
      content="{{ page.og.description | default: page.description | escape }}">

<meta property="og:type"
      content="{{ page.og.type | default: 'website' }}">

{% if page.og.image %}
<meta property="og:image"
      content="{{ page.og.image | absolute_url }}">
{% endif %}
{% endif %}

{% if page.jsonld %}
<script type="application/ld+json">
{{ page.jsonld | jsonify }}
</script>
{% endif %}

<link
  rel="stylesheet"
  href="{{ '/assets/css/style.css' | relative_url }}"
>
