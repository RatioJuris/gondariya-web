<header class="sticky top-0 z-50 border-b border-slate-900/5 bg-white/90 backdrop-blur-xl">

  <div
    class="mx-auto flex min-h-[82px] max-w-7xl items-center justify-between gap-8 px-6 lg:px-8"
  >
    <a
      href="{{ '/' | relative_url }}"
      aria-label="Gonardiya"
      class="shrink-0"
    >
      <img
        src="{{ '/assets/gonardiya.png' | relative_url }}"
        alt="Gonardiya"
        width="2192"
        height="585"
        class="h-10 w-auto object-contain sm:h-11"
      >
    </a>

    <!-- Desktop navigation -->
    <nav
      class="hidden items-center gap-8 md:flex"
      aria-label="Primary navigation"
    >

      <a
        href="{{ '/' | relative_url }}"
        class="text-sm font-medium text-slate-600 transition hover:text-[#0B1F3A]"
      >
        Home
      </a>

      <a
        href="{{ '/about/' | relative_url }}"
        class="text-sm font-medium text-slate-600 transition hover:text-[#0B1F3A]"
      >
        About
      </a>

      <a
        href="{{ '/terms/' | relative_url }}"
        class="text-sm font-medium text-slate-600 transition hover:text-[#0B1F3A]"
      >
        Terms
      </a>

      <a
        href="{{ '/privacy-policy/' | relative_url }}"
        class="text-sm font-medium text-slate-600 transition hover:text-[#0B1F3A]"
      >
        Privacy
      </a>

    </nav>

    <!-- Mobile navigation -->
    <details class="relative md:hidden">

      <summary
        class="flex h-10 w-10 cursor-pointer list-none items-center justify-center rounded-full border border-slate-200 text-[#0B1F3A]"
        aria-label="Open navigation"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </summary>

      <div
        class="absolute right-0 top-14 w-56 rounded-2xl border border-slate-200 bg-white p-2 shadow-xl shadow-slate-900/10"
      >

        <a
          href="{{ '/' | relative_url }}"
          class="block rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:bg-slate-50"
        >
          Home
        </a>

        <a
          href="{{ '/about/' | relative_url }}"
          class="block rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:bg-slate-50"
        >
          About
        </a>

        <a
          href="{{ '/terms/' | relative_url }}"
          class="block rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:bg-slate-50"
        >
          Terms
        </a>

        <a
          href="{{ '/privacy-policy/' | relative_url }}"
          class="block rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:bg-slate-50"
        >
          Privacy
        </a>

      </div>

    </details>

  </div>

</header>
